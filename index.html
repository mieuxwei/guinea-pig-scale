<style>
  :root {

    --good: #22a35a; --watch: #e09400; --alert: #dc3b3b; --none: #9aa3ad; --tag: #8b5cf6;
  }
  @media (prefers-color-scheme: dark) {

  body { margin: 0; background: var(--bg); color: var(--text);

  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }

  /* 深色模式：彩色半透明底疊在深色上會變成棕色 → 改成中性灰底＋彩色外框 */

<script>
// icon 只內嵌一份，其他地方共用
document.getElementById("logo").src = document.getElementById("favicon").href;

// ---- 設定（publishable key 本來就是公開的；只開放唯讀的公開資料） ----
const SUPABASE_URL = "https://ldiampzyxdnxsabkjcci.supabase.co";
const KEY = "sb_publishable_NvO6F_kCvScrcMtSy4INyg_bc78oEBU";

const DAY = 86400000;
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const fmtDate = d => `${d.getMonth() + 1}/${d.getDate()}`;
const pct = v => `${v >= 0 ? "+" : ""}${(v * 100).toFixed(1)}%`;

async function rest(path) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: KEY } });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

// ---- 每天取第一筆 ----
function dailyWeights(rows) {
  const byDay = new Map();
  for (const r of rows) {
    const t = new Date(r.measured_at), d = startOfDay(t).getTime();
    const cur = byDay.get(d);
    if (!cur || t < cur.t) byDay.set(d, { t, grams: r.grams });
  }
  return [...byDay.entries()].map(([d, v]) => ({ day: new Date(d), grams: v.grams })).sort((a, b) => a.day - b.day);
}

function regression(points) {   // [{x, y}] → slope
  const n = points.length, mx = points.reduce((s, p) => s + p.x, 0) / n, my = points.reduce((s, p) => s + p.y, 0) / n;
  const sxx = points.reduce((s, p) => s + (p.x - mx) ** 2, 0);
  if (!sxx) return { slope: 0, mx, my };
  return { slope: points.reduce((s, p) => s + (p.x - mx) * (p.y - my), 0) / sxx, mx, my };
}

// ---- 體重增幅：最新一筆比前一筆（同一天秤兩次也算）；比約 7 天前（5–9 天前那天的第一筆） ----
function weightGain(rows, days) {
  if (!rows.length) return null;
  const last = rows[rows.length - 1], out = { latest: { grams: last.grams, at: new Date(last.measured_at) } };
  if (rows.length >= 2) { const p = rows[rows.length - 2]; out.prev = last.grams - p.grams; out.ratio = (last.grams - p.grams) / p.grams; }
  const lastDay = startOfDay(out.latest.at);
  const ref = days.slice().reverse().find(d => { const n = Math.round((lastDay - d.day) / DAY); return n >= 5 && n <= 9; });
  if (ref) out.week = last.grams - ref.grams;
  return out;
}

// ---- 年齡估計（與 App 的 AgeEstimator 相同） ----
const CURVE = {
  male: [[0, 95], [1, 140], [2, 190], [4, 290], [6, 380], [8, 460], [10, 530], [12, 600], [16, 700], [20, 780], [26, 860], [39, 950], [52, 1000], [78, 1050]],
  female: [[0, 90], [1, 130], [2, 175], [4, 270], [6, 350], [8, 420], [10, 480], [12, 540], [16, 620], [20, 680], [26, 740], [39, 820], [52, 880], [78, 920]],
};
function expected(weeks, sex) {
  const c = CURVE[sex] || CURVE.female;
  if (weeks <= c[0][0]) return c[0][1];
  for (let i = 1; i < c.length; i++) if (weeks <= c[i][0]) {
    const [a, b] = [c[i - 1], c[i]]; return a[1] + (b[1] - a[1]) * (weeks - a[0]) / (b[0] - a[0]);
  }
  return c[c.length - 1][1];
}
function weeksFor(g, sex) {
  const c = CURVE[sex] || CURVE.female;
  if (g <= c[0][1]) return 0;
  for (let i = 1; i < c.length; i++) if (g <= c[i][1]) {
    const [a, b] = [c[i - 1], c[i]]; return a[0] + (b[0] - a[0]) * (g - a[1]) / (b[1] - a[1]);
  }
  return c[c.length - 1][0];
}
function estimateAge(days, sex) {
  if (!days.length) return null;
  const latest = days[days.length - 1], g = latest.grams;
  const recent = days.filter(d => latest.day - d.day <= 28 * DAY);
  let gain = null;
  if (recent.length >= 3 && latest.day - recent[0].day >= 7 * DAY)
    gain = regression(recent.map(d => ({ x: (d.day - recent[0].day) / DAY, y: d.grams }))).slope * 7;
  if (g >= expected(52, sex) * 0.95 && (gain ?? 0) < 15) return { stage: "adult", text: "成鼠（約 1 歲以上）" };
  let w = weeksFor(g, sex);
  if (gain !== null && w < 39) {
    const eg = expected(w + 1, sex) - expected(w, sex);
    if (eg > 5) { const r = gain / eg; if (r < 0.5) w *= 1.25; else if (r > 1.5) w *= 0.85; }
  }
  const spread = Math.max(2, w * 0.2), lo = Math.max(0, Math.round(w - spread)), hi = Math.round(w + spread);
  const stage = w < 6 ? "baby" : w < 26 ? "juvenile" : w < 52 ? "youngAdult" : "adult";
  if (stage === "adult") return { stage, text: "成鼠（約 1 歲以上）" };
  const label = { baby: "小幼鼠", juvenile: "幼鼠", youngAdult: "亞成鼠" }[stage];
  let text;
  if (hi <= 16) text = `約 ${lo}–${hi} 週（${label}）`;
  else { const a = Math.max(1, Math.round(lo / 4.35)), b = Math.max(a, Math.round(hi / 4.35)); text = a === b ? `約 ${a} 個月（${label}）` : `約 ${a}–${b} 個月（${label}）`; }
  return { stage, text, weeksMid: (lo + hi) / 2 };
}

// ---- 健康分析（與 App 的 HealthAnalyzer 相同） ----
function analyze(days, sex, birthDate, tags) {
  if (!days.length) return { status: "noData", reasons: ["還沒有體重紀錄"] };
  const latest = days[days.length - 1], today = startOfDay(new Date());
  const red = [], yellow = [], dropRed = [], dropYellow = [];
  const out = { latest };
  const treatment = tags.includes("治療中"), soften = tags.includes("懷孕") || tags.includes("哺乳");
  const since = Math.round((today - latest.day) / DAY);
  if (since >= 3) red.push(`已 ${since} 天沒秤`); else if (since === 2) yellow.push("已 2 天沒秤");
  if (days.length >= 2) {
    const prev = days[days.length - 2], c = (latest.grams - prev.grams) / prev.grams;
    out.change = c;
    if (c <= (treatment ? -0.03 : -0.05)) dropRed.push(`比前次 ${pct(c)}`);
  }
  const weekAgo = new Date(latest.day - 7 * DAY);
  const lastWeek = days.slice(0, -1).filter(d => d.day >= weekAgo);
  if (lastWeek.length) {
    const peak = Math.max(...lastWeek.map(d => d.grams)), c = (latest.grams - peak) / peak;
    if (c <= -0.10) dropRed.push(`7 天內 ${pct(c)}`); else if (c <= -0.03) dropYellow.push(`7 天內 ${pct(c)}`);
  }
  if (days.length >= 4) {
    const l4 = days.slice(-4).map(d => d.grams);
    const falling = l4.every((v, i) => i === 0 || l4[i - 1] > v), total = (l4[3] - l4[0]) / l4[0];
    if (falling && total <= -0.03) dropRed.push(`連續 3 次下降（${pct(total)}）`);
  }
  const month = days.filter(d => d.day >= new Date(latest.day - 30 * DAY));
  if (month.length >= 4) {
    const pts = month.map(d => ({ x: (d.day - month[0].day) / DAY, y: d.grams })), { slope, my } = regression(pts);
    const span = pts[pts.length - 1].x - pts[0].x;
    if (span >= 14 && slope < 0 && -slope * span / my >= 0.03) dropYellow.push(`30 天趨勢 ${Math.round(slope * 7)} g／週`);
  }
  const week = days.filter(d => d.day >= weekAgo);
  if (week.length >= 4) {
    const pts = week.map(d => ({ x: (d.day - week[0].day) / DAY, y: d.grams })), { slope, mx, my } = regression(pts);
    const sd = Math.sqrt(pts.reduce((s, p) => s + (p.y - (my + slope * (p.x - mx))) ** 2, 0) / pts.length);
    if (sd / my > 0.025) yellow.push(`7 天波動大（±${(sd / my * 100).toFixed(1)}%）`);
  }
  // 年齡：有生日用生日，沒有就用估計的階段
  let months = null;
  if (birthDate) months = (today - new Date(birthDate)) / DAY / 30.44;
  else { const e = estimateAge(days, sex); if (e) months = e.stage === "adult" ? 18 : e.stage === "youngAdult" ? null : e.weeksMid / 4.35; }
  if (months !== null) {
    if (months < 6) {
      const ref = [...days].reverse().find(d => d.day >= new Date(latest.day - 9 * DAY) && d.day <= new Date(latest.day - 5 * DAY));
      if (ref && latest.grams <= ref.grams) yellow.push("幼鼠 7 天沒增重");
    } else {
      const [lo, hi] = sex === "male" ? [900, 1200] : [700, 1000];
      if (latest.grams < lo) yellow.push(`低於參考範圍（${lo}–${hi} g）`);
    }
  }
  if (soften) yellow.push(...dropRed, ...dropYellow); else { red.push(...dropRed); yellow.push(...dropYellow); }
  out.status = red.length ? "alert" : yellow.length ? "watch" : "good";
  out.reasons = [...red, ...yellow];
  return out;
}

const STATUS = { alert: ["🔴", "警示"], watch: ["🟡", "注意"], good: ["🟢", "良好"], noData: ["⚪️", "資料不足"] };


// ---- 頭貼與照片（只開放頭貼與今天的秤重照片） ----
async function avatarURL(key) {
  if (!key) return null;
  try {
    const r = await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/files/${key}`, { headers: { apikey: KEY } });
    return r.ok ? URL.createObjectURL(await r.blob()) : null;
  } catch { return null; }
}

let pigs = [], filter = "all", query = "", sortBy = "status", groupChart = null, pigChart = null;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const gtxt = d => d === 0 ? "±0 g" : `${d > 0 ? "+" : ""}${d} g`;
const avatarHtml = (p, cls = "avatar") => p.avatar ? `<img class="${cls}" src="${p.avatar}" alt="">` : `<div class="${cls}">${esc(p.name.slice(0, 1))}</div>`;
const ORDER = ["alert", "watch", "noData", "good"];

function weeklyStats(days) {
  const m = new Map();
  for (const d of days) {
    const w = startOfDay(d.day); w.setDate(w.getDate() - ((w.getDay() + 6) % 7));
    const k = w.getTime(); if (!m.has(k)) m.set(k, []); m.get(k).push(d.grams);
  }
  return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([k, g]) => ({
    week: new Date(k), mean: g.reduce((s, v) => s + v, 0) / g.length, min: Math.min(...g), max: Math.max(...g) }));
}

// 牠自己的正常範圍：最近 14 天（至少 3 天）的中位數 ±3%
function normalBand(days) {
  if (!days.length) return null;
  const last = days[days.length - 1].day, v = days.filter(d => last - d.day <= 14 * DAY).map(d => d.grams).sort((a, b) => a - b);
  if (v.length < 3) return null;
  const mid = v[Math.floor(v.length / 2)];
  return { lo: mid * 0.97, hi: mid * 1.03, mid };
}

function weekChange(p) {
  const g = p.gain; if (!g || g.week === undefined) return null;
  const base = g.latest.grams - g.week; return base > 0 ? { d: g.week, r: g.week / base } : null;
}

// ---- 總覽 ----
function renderOverview() {
  const today = startOfDay(new Date()).getTime();
  const done = pigs.filter(p => p.days.length && p.days[p.days.length - 1].day.getTime() === today).length;
  document.getElementById("todayCount").innerHTML = `${done}<span class="sub" style="font-size:16px;font-weight:400"> ／ ${pigs.length} 隻</span>`;
  document.getElementById("ringArc").setAttribute("stroke-dasharray", `${pigs.length ? done / pigs.length * 100 : 0} 100`);
  const count = s => pigs.filter(p => p.health.status === s).length;
  const alert = count("alert"), watch = count("watch");
  let drop = null;
  for (const p of pigs) {
    const d = p.days; if (d.length < 2) continue;
    const last = d[d.length - 1], ref = d.slice(0, -1).reverse().find(x => last.day - x.day <= 3 * DAY) || d[d.length - 2];
    const r = (last.grams - ref.grams) / ref.grams;
    if (r <= -0.02 && (!drop || r < drop.r)) drop = { p, r };
  }
  const parts = [alert ? `${alert} 隻需要注意健康` : watch ? `${watch} 隻要多留意` : "大家體重都穩定"];
  if (drop) parts.push(`${drop.p.name} 近 3 天 ${pct(drop.r)}`);
  const h = document.getElementById("headline");
  h.textContent = parts.join("，");
  h.style.color = alert ? css("--alert") : watch ? css("--watch") : css("--good");
  document.getElementById("pills").innerHTML = ["alert", "watch", "good", "noData"].map(s =>
    `<div class="pill ${s} ${count(s) ? "on" : ""}"><b>${count(s)}</b>${STATUS[s][1]}</div>`).join("");
}

function renderHeatmap() {
  const today = startOfDay(new Date()), N = 21;
  const dates = Array.from({ length: N }, (_, i) => new Date(today - (N - 1 - i) * DAY));
  const head = `<div class="hrow"><div class="hname"></div>${dates.map(d => `<div class="hday">${d.getDate()}</div>`).join("")}</div>`;
  const rows = pigs.slice().sort((a, b) => a.name.localeCompare(b.name, "zh-Hant")).map(p => {
    const by = new Map(p.days.map(d => [d.day.getTime(), d.grams]));
    const cells = dates.map(d => {
      const g = by.get(d.getTime());
      if (g === undefined) return `<div class="cell" title="${fmtDate(d)} 沒秤"></div>`;
      const prev = p.days.filter(x => x.day < d).pop();
      let c = "c-flat", r = 0;
      if (prev) { r = (g - prev.grams) / prev.grams; c = r <= -0.05 ? "c-drop" : r <= -0.02 ? "c-dip" : r > 0.01 ? "c-up" : "c-flat"; }
      return `<div class="cell ${c}" title="${fmtDate(d)}　${g} g${prev ? `（${pct(r)}）` : ""}"></div>`;
    }).join("");
    return `<div class="hrow"><div class="hname" data-id="${p.id}">${esc(p.name)}</div>${cells}</div>`;
  }).join("");
  const heat = document.getElementById("heat");
  heat.innerHTML = head + rows;
  heat.scrollLeft = heat.scrollWidth;   // 手機上預設捲到最近幾天
}

function renderRanking() {
  const list = pigs.map(p => ({ p, w: weekChange(p) })).filter(x => x.w).sort((a, b) => b.w.r - a.w.r);
  const row = x => `<div class="r" data-id="${x.p.id}">${avatarHtml(x.p, "mini")}<span>${esc(x.p.name)}</span>
    <span class="v ${x.w.d > 0 ? "up" : x.w.r <= -0.05 ? "bad" : "down"}">${gtxt(x.w.d)}（${pct(x.w.r)}）</span></div>`;
  const up = list.filter(x => x.w.d > 0).slice(0, 3), down = list.filter(x => x.w.d < 0).reverse().slice(0, 3);
  const empty = `<div class="sub">累積一週以上的紀錄後會顯示。</div>`;
  document.getElementById("rankUp").innerHTML = up.map(row).join("") || empty;
  document.getElementById("rankDown").innerHTML = down.map(row).join("") || empty;
}

function drawGroup() {
  const from = new Date(Date.now() - 84 * DAY);
  const series = sex => {
    const per = pigs.filter(p => p.sex === sex).map(p => weeklyStats(p.days.filter(d => d.day >= from)));
    const total = new Set(per.flat().map(w => w.week.getTime())).size, need = Math.max(2, Math.ceil(total * 0.6));
    const m = new Map();
    for (const ws of per) if (ws.length >= need) for (const w of ws) { const k = w.week.getTime(); if (!m.has(k)) m.set(k, []); m.get(k).push(w.mean); }
    return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([k, v]) => ({ x: fmtDate(new Date(k)), k, y: Math.round(v.reduce((s, x) => s + x, 0) / v.length) }));
  };
  const male = series("male"), female = series("female");
  const labels = [...new Set([...male, ...female].sort((a, b) => a.k - b.k).map(p => p.x))];
  const box = document.getElementById("group").parentElement;
  if (!labels.length) { box.style.height = "auto"; box.innerHTML = `<div class="sub">累積 2 週以上的紀錄後，這裡會顯示公、母兩組的平均體重。</div>`; return; }
  const align = s => labels.map(l => s.find(p => p.x === l)?.y ?? null);
  groupChart?.destroy();
  groupChart = new Chart(document.getElementById("group"), { type: "line",
    data: { labels, datasets: [
      { label: "公", data: align(male), borderColor: css("--male"), backgroundColor: css("--male"), spanGaps: true },
      { label: "母", data: align(female), borderColor: css("--female"), backgroundColor: css("--female"), spanGaps: true } ] },
    options: chartOptions() });
}

function chartOptions(extra = {}) {
  return { maintainAspectRatio: false, plugins: { legend: { labels: { color: css("--text") } }, ...extra.plugins },
    scales: { x: { ticks: { color: css("--muted") }, grid: { color: css("--line") } },
              y: { ticks: { color: css("--muted") }, grid: { color: css("--line") }, title: { display: true, text: "g", color: css("--muted") } } } };
}

function sparkline(p) {
  const d = p.days.filter(x => x.day >= new Date(Date.now() - 28 * DAY));
  if (d.length < 2) return "";
  const v = d.map(x => x.grams), lo = Math.min(...v), hi = Math.max(...v), span = Math.max(1, hi - lo);
  const pts = d.map((x, i) => `${(i / (d.length - 1) * 100).toFixed(1)},${(30 - (x.grams - lo) / span * 26 - 2).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function renderList() {
  const q = query.trim().toLowerCase();
  const shown = pigs.filter(p => (filter === "all" || p.sex === filter) &&
      (!q || p.name.toLowerCase().includes(q) || p.tagsAppearance.some(t => t.includes(q))))
    .sort((a, b) => {
      const wa = a.gain?.latest.grams ?? -1, wb = b.gain?.latest.grams ?? -1;
      if (sortBy === "name") return a.name.localeCompare(b.name, "zh-Hant");
      if (sortBy === "heavy") return wb - wa;
      if (sortBy === "light") return (wa < 0 ? 1e9 : wa) - (wb < 0 ? 1e9 : wb);
      if (sortBy === "week") return (weekChange(a)?.r ?? 9) - (weekChange(b)?.r ?? 9);
      return ORDER.indexOf(a.health.status) - ORDER.indexOf(b.health.status) || a.name.localeCompare(b.name, "zh-Hant");
    });
  document.getElementById("list").innerHTML = shown.map(p => {
    const h = p.health, [emo, lab] = STATUS[h.status], sym = p.sex === "male" ? "♂" : "♀", g = p.gain;
    const gainHtml = !g ? "" : g.prev !== undefined
      ? `<div class="gain ${g.ratio <= -0.03 ? "bad" : g.prev > 0 ? "up" : g.prev < 0 ? "down" : ""}">${g.prev > 0 ? "▲" : g.prev < 0 ? "▼" : "＝"} ${gtxt(g.prev)}</div>`
      : `<div class="sub">第一筆</div>`;
    const latest = g ? `<b>${g.latest.grams}</b> g${gainHtml}` : `<div class="sub">未秤</div>`;
    return `<div class="pig" data-id="${p.id}">
      <div class="top">${avatarHtml(p)}<div><div class="name">${esc(p.name)} <span class="${p.sex}">${sym}</span></div>
        <div class="sub">${p.age ? p.age.text : ""}</div>
        ${p.tagsAppearance.length ? `<div class="tags">${p.tagsAppearance.map(t => "#" + esc(t)).join(" ")}</div>` : ""}</div>
        <div class="weight">${latest}</div></div>
      ${sparkline(p)}
      <span class="chip s-${h.status}">${emo} ${lab}</span>
      ${h.reasons.length && h.status !== "noData" ? `<div class="reasons">${h.reasons.map(esc).join("・")}</div>` : ""}
    </div>`;
  }).join("") || `<div class="sub">沒有符合的天竺鼠。</div>`;
}

// ---- 個人頁（#pig=<id>） ----
function renderDetail(p) {
  const h = p.health, [emo, lab] = STATUS[h.status], g = p.gain, wc = weekChange(p);
  const d = p.days, month = d.filter(x => x.day >= new Date(d.length ? d[d.length - 1].day - 30 * DAY : 0));
  const m30 = month.length >= 2 ? month[month.length - 1].grams - month[0].grams : null;
  const stat = (v, t, cls = "") => `<div class="stat"><b class="${cls}">${v}</b><span>${t}</span></div>`;
  const el = document.getElementById("detail");
  el.innerHTML = `<button class="back" id="back">‹ 回到全部</button>
    <div class="card">
      <div class="hero">${avatarHtml(p)}<div>
        <div class="name" style="font-size:24px">${esc(p.name)} <span class="${p.sex}">${p.sex === "male" ? "♂" : "♀"}</span></div>
        <div class="sub">${p.age ? p.age.text : ""}${p.days.length ? `・共 ${p.days.length} 天紀錄` : ""}</div>
        ${p.tagsAppearance.length ? `<div class="tags">${p.tagsAppearance.map(t => "#" + esc(t)).join(" ")}</div>` : ""}
        <span class="chip s-${h.status}">${emo} ${lab}</span></div></div>
      ${h.reasons.length && h.status !== "noData" ? `<div class="reasons">${h.reasons.map(esc).join("・")}</div>` : ""}
      <div class="stats">
        ${stat(g ? `${g.latest.grams} g` : "—", g ? `最新（${fmtDate(g.latest.at)}）` : "最新")}
        ${stat(g && g.prev !== undefined ? gtxt(g.prev) : "—", "比前一次", g && g.prev < 0 ? "down" : "up")}
        ${stat(wc ? `${gtxt(wc.d)}` : "—", wc ? `7 天（${pct(wc.r)}）` : "7 天", wc && wc.d < 0 ? (wc.r <= -0.05 ? "bad" : "down") : "up")}
        ${stat(m30 !== null ? gtxt(m30) : "—", "30 天", m30 < 0 ? "down" : "up")}
      </div>
    </div>
    <div class="card">
      <h2>體重曲線</h2>
      <div class="spans">${[["14", "2 週"], ["28", "4 週"], ["91", "3 個月"], ["all", "全部"]]
        .map(([v, t], i) => `<button data-span="${v}" class="${i === 0 ? "on" : ""}">${t}</button>`).join("")}</div>
      <div class="chartbox"><canvas id="pigChart"></canvas></div>
      <div class="sub" id="bandNote"></div>
    </div>
    ${p.photos.length ? `<div class="card"><h2>今天的照片</h2><div class="photos">${p.photos.map((ph, i) =>
      `<img src="${ph.url}" alt="" data-i="${i}" title="${ph.grams} g">`).join("")}</div></div>` : ""}`;
  el.querySelector("#back").onclick = () => { location.hash = ""; };
  el.querySelectorAll(".spans button").forEach(b => b.onclick = () => {
    el.querySelectorAll(".spans button").forEach(x => x.classList.toggle("on", x === b)); drawPigChart(p, b.dataset.span); });
  el.querySelectorAll(".photos img").forEach(img => img.onclick = () => openPhoto(p, p.photos[+img.dataset.i]));
  drawPigChart(p, "14");
}

function drawPigChart(p, span) {
  pigChart?.destroy();
  const back = { "14": 14, "28": 28, "91": 91, "all": null }[span];
  const from = back ? new Date(startOfDay(new Date()) - (back - 1) * DAY) : new Date(0);
  const days = p.days.filter(d => d.day >= from), band = normalBand(p.days), accent = css("--accent"), good = css("--good");
  const note = document.getElementById("bandNote");
  if (days.length < 2) { note.textContent = "這段期間少於 2 筆紀錄。"; return; }
  const labels = days.map(d => fmtDate(d.day)), sets = [];
  if (band) {
    sets.push({ label: "正常上限", data: days.map(() => Math.round(band.hi)), borderColor: "transparent", backgroundColor: good + "22", fill: "+1", pointRadius: 0 });
    sets.push({ label: "正常下限", data: days.map(() => Math.round(band.lo)), borderColor: "transparent", pointRadius: 0 });
  }
  sets.push({ label: "體重", data: days.map(d => d.grams), borderColor: accent, backgroundColor: accent,
    pointBackgroundColor: days.map(d => band && d.grams < band.lo ? css("--watch") : accent), tension: 0.25 });
  pigChart = new Chart(document.getElementById("pigChart"), { type: "line", data: { labels, datasets: sets },
    options: chartOptions({ plugins: { legend: { display: false } } }) });
  note.textContent = band ? `綠色帶 = 牠最近兩週的正常範圍（${Math.round(band.lo)}–${Math.round(band.hi)} g），低於色帶的點會變成橘色。` : "";
}

function openPhoto(p, ph) {
  const v = document.getElementById("viewer");
  v.querySelector("img").src = ph.url;
  v.querySelector("div").textContent = `${p.name}・${ph.at.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" })}・${ph.grams} g`;
  v.classList.add("on");
}

function route() {
  const id = new URLSearchParams(location.hash.slice(1)).get("pig"), p = pigs.find(x => x.id === id);
  document.getElementById("home").classList.toggle("hidden", !!p);
  document.getElementById("detail").classList.toggle("hidden", !p);
  if (p) { renderDetail(p); document.title = `${p.name}｜天竺鼠體重房`; window.scrollTo(0, 0); }
  else { pigChart?.destroy(); document.title = "天竺鼠體重房"; }
}

const openPig = id => { location.hash = `pig=${encodeURIComponent(id)}`; };
document.getElementById("list").addEventListener("click", e => { const el = e.target.closest(".pig"); if (el) openPig(el.dataset.id); });
document.getElementById("heat").addEventListener("click", e => { const el = e.target.closest(".hname[data-id]"); if (el) openPig(el.dataset.id); });
["rankUp", "rankDown"].forEach(id => document.getElementById(id).addEventListener("click", e => { const el = e.target.closest(".r"); if (el) openPig(el.dataset.id); }));
document.getElementById("viewer").addEventListener("click", e => e.currentTarget.classList.remove("on"));
document.getElementById("sexSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f; document.querySelectorAll("#sexSeg button").forEach(x => x.classList.toggle("on", x === b)); renderList(); });
document.getElementById("search").addEventListener("input", e => { query = e.target.value; renderList(); });
document.getElementById("sort").addEventListener("change", e => { sortBy = e.target.value; renderList(); });
window.addEventListener("hashchange", route);

(async () => {
  try {
    const [pigRows, weightRows, photoRows] = await Promise.all([
      rest("public_pigs?select=*"),
      rest("public_weights?select=pig_id,measured_at,grams&order=measured_at&limit=20000"),
      rest("public_today_photos?select=pig_id,measured_at,grams,photo_key&order=measured_at").catch(() => []),
    ]);
    pigs = await Promise.all(pigRows.map(async r => {
      const rows = weightRows.filter(w => w.pig_id === r.id), days = dailyWeights(rows);
      const photos = (await Promise.all(photoRows.filter(x => x.pig_id === r.id).map(async x =>
        ({ url: await avatarURL(x.photo_key), grams: x.grams, at: new Date(x.measured_at) })))).filter(x => x.url);
      return { id: r.id, name: r.name, sex: r.sex, days, avatar: await avatarURL(r.avatar_key),
               age: r.birth_date ? null : estimateAge(days, r.sex), health: analyze(days, r.sex, r.birth_date, r.tags || []),
               gain: weightGain(rows, days), tagsAppearance: r.appearance_tags || [], photos };
    }));
    const last = weightRows.length ? new Date(weightRows[weightRows.length - 1].measured_at) : null;
    document.getElementById("updated").textContent =
      `${pigs.length} 隻・最近一次秤重：${last ? last.toLocaleString("zh-TW", { dateStyle: "medium", timeStyle: "short" }) : "—"}`;
    renderOverview(); renderHeatmap(); renderRanking(); drawGroup(); renderList(); route();
  } catch (e) {
    document.getElementById("updated").innerHTML = `<span class="err">讀取失敗：${esc(e.message)}</span>`;
  }
})();
</script>
